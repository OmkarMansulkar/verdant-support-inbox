# Render Blueprint for the backend API. Secrets use `sync: false`:
# Render asks for their values in the dashboard; they are never stored in this file.
services:
  - type: web
    # Same region as the Supabase database (ap-southeast-1): every request makes
    # several database round trips, ~1-2 ms each in one region, ~180 ms across the
    # Pacific. Render can't move an existing service, so a region change means a
    # new service with a new name (a Blueprint with an existing service's name
    # updates that service and keeps its region).
    name: verdant-support-inbox-api-sg
    region: singapore
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-20b
